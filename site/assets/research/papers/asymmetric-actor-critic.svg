<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Asymmetric actor–critic learning</title>
  <desc id="desc">During training, the critic receives state and observation information while the actor learns from observations to choose actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#54718e"/>
    </marker>
    <linearGradient id="actor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f7f3"/>
      <stop offset="1" stop-color="#bde8f0"/>
    </linearGradient>
    <linearGradient id="critic" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e3eaff"/>
      <stop offset="1" stop-color="#d2dafe"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" rx="24" fill="#f7f9fc"/>
  <text x="50" y="58" fill="#14283e" font-family="Arial, sans-serif" font-size="23" font-weight="700">Asymmetric actor–critic</text>
  <text x="50" y="91" fill="#60748a" font-family="Arial, sans-serif" font-size="16">Extra state information helps training; the policy acts on observations.</text>
  <rect x="48" y="124" width="804" height="385" rx="18" fill="#fff" stroke="#d9e2eb"/>
  <rect x="68" y="143" width="764" height="35" rx="17" fill="#eef3f7"/>
  <text x="90" y="166" fill="#34506c" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">TRAINING</text>
  <rect x="89" y="222" width="190" height="84" rx="14" fill="#f0f4f8" stroke="#c5d1de" stroke-width="2"/>
  <text x="184" y="256" text-anchor="middle" fill="#243a51" font-family="Arial, sans-serif" font-size="18" font-weight="700">Environment</text>
  <text x="184" y="281" text-anchor="middle" fill="#526a81" font-family="Arial, sans-serif" font-size="15">state sₜ and observation oₜ</text>
  <rect x="374" y="212" width="190" height="73" rx="14" fill="url(#actor)" stroke="#50aaa9" stroke-width="2"/>
  <text x="469" y="242" text-anchor="middle" fill="#174e60" font-family="Arial, sans-serif" font-size="18" font-weight="700">Actor π(aₜ | oₜ)</text>
  <text x="469" y="266" text-anchor="middle" fill="#416d79" font-family="Arial, sans-serif" font-size="14">observation only</text>
  <rect x="374" y="366" width="190" height="83" rx="14" fill="url(#critic)" stroke="#718bd1" stroke-width="2"/>
  <text x="469" y="401" text-anchor="middle" fill="#263f82" font-family="Arial, sans-serif" font-size="18" font-weight="700">Critic Q(sₜ, oₜ, aₜ)</text>
  <text x="469" y="426" text-anchor="middle" fill="#53699a" font-family="Arial, sans-serif" font-size="14">state available in training</text>
  <rect x="665" y="222" width="140" height="84" rx="14" fill="#fff7e9" stroke="#edbd70" stroke-width="2"/>
  <text x="735" y="256" text-anchor="middle" fill="#78521b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Action aₜ</text>
  <text x="735" y="281" text-anchor="middle" fill="#907142" font-family="Arial, sans-serif" font-size="14">chosen by actor</text>
  <path d="M279 244h77" fill="none" stroke="#54718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M279 280c40 0 35 128 77 128" fill="none" stroke="#54718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M564 248h86" fill="none" stroke="#54718e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M735 306c0 82-65 105-156 105" fill="none" stroke="#8298ae" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="M470 366v-61" fill="none" stroke="#718bd1" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="90" y="477" fill="#60748a" font-family="Arial, sans-serif" font-size="14">The asymmetric critic uses privileged state information to guide policy learning.</text>
</svg>
