name: Publish ILLS website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "build.py"
      - "content/**"
      - "tools/check_site.py"
      - "ills-site-assets.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Restore website image and document assets
        run: unzip -qo ills-site-assets.zip -d . -x site/assets/style.css
      - name: Generate both language editions and check internal links
        run: |
          python3 -B build.py
          python3 -B tools/check_site.py
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
